<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>afterhours · group invite</title>
  <meta name="robots" content="noindex" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="afterhours" />
  <meta property="og:title" content="a group invite — afterhours" />
  <meta property="og:description" content="Friends planning a night together. Open the link to join the group." />
  <meta property="og:url" content="https://kurtkurtkurt-del.github.io/afterhours/g/" />
  <meta property="og:image" content="https://kurtkurtkurt-del.github.io/afterhours/og/afterhours.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png" />
  <style>
    :root { --ink: #0E0D0C; --paper: #F3F1EC; --spot: #E5322D; --mute: #8C877F; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--ink); color: var(--paper); font: 16px/1.45 system-ui, -apple-system, sans-serif;
           display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    main { max-width: 360px; width: 100%; text-align: center; }
    .logo { font-weight: 800; font-size: 28px; letter-spacing: -0.5px; }
    .logo b { color: var(--spot); }
    p { color: var(--mute); }
    .code { font: 600 30px/1 ui-monospace, Menlo, monospace; letter-spacing: 6px; margin: 28px 0 8px; }
    a.open { display: block; margin-top: 28px; padding: 14px; border-radius: 999px; background: var(--paper); color: var(--ink); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <div class="logo">afterhours<b>.</b></div>
    <p id="line">you are invited to a group: swipe nights together, find the one you all want.</p>
    <div class="code" id="code">········</div>
    <p>in the app: yours → groups → join with a code</p>
    <a class="open" id="open" href="#">open in the app</a>
  </main>
  <script>
    // The code from ?c=; only letters and digits pass, so nothing else reaches the page.
    var c = (new URLSearchParams(location.search).get("c") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
    if (c) {
      document.getElementById("code").textContent = c;
      document.getElementById("open").href = "afterhours://groups/join?code=" + c;
    }
  </script>
  <script src="../webapp.js?v=202"></script>
</body>
