<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>admin | afterhours</title>
  <meta name="description" content="Discover what's happening tonight in your city — raves, club nights, concerts, festivals, meetups and house parties. One card at a time, and no search anywhere." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="afterhours" />
  <meta property="og:title" content="afterhours — afterhours" />
  <meta property="og:description" content="Discover what's happening tonight in your city — raves, club nights, concerts, festivals, meetups and house parties. One card at a time, and no search anywhere." />
  <meta property="og:url" content="https://kurtkurtkurt-del.github.io/afterhours/admin/index.html" />
  <meta property="og:image" content="https://kurtkurtkurt-del.github.io/afterhours/og/afterhours.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#000000" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png" />
  <link rel="stylesheet" href="../fonts/fonts.css?v=140" />
  <link rel="stylesheet" href="../style.css?v=140" />
  <link rel="stylesheet" href="admin.css?v=140" />
</head>
<body class="admin">

  <a class="skip" href="#adm-gate">skip to the content</a>

  <header class="header">
    <a class="logo" href="../index.html">afterhours</a>
    <nav class="header-links">
      <a href="../explore/index.html">explore</a>
      <a href="../maps/index.html">maps</a>
      <a href="../friends/index.html">friends&amp;more</a>
      <a href="../cards/index.html">card collection</a>
      <a href="../help/index.html">help</a>
      <a href="../login/index.html">login</a>
    </nav>
  </header>

  <!-- The gate: signed out or not an admin, this is as far as it goes -->
  <main tabindex="-1" class="adm-gate" id="adm-gate">
    <p class="adm-gate-text" id="adm-gate-text">checking…</p>

    <form class="adm-intro" id="adm-intro" hidden>
      <input class="adm-intro-field" id="adm-email" type="email"
             placeholder="email" autocomplete="username" />
      <input class="adm-intro-field" id="adm-password" type="password"
             placeholder="password" autocomplete="current-password" />
      <button class="adm-intro-button" type="submit">sign in</button>
    </form>
    <p class="adm-intro-note" id="adm-intro-note"></p>

    <a class="adm-gate-link" id="adm-gate-link" href="../login/index.html" hidden>use a link instead</a>
  </main>

  <main class="adm" id="adm" hidden>

    <aside class="adm-list-field">
      <div class="adm-tools">
        <input class="adm-search" id="adm-search" type="search" placeholder="search events" />
        <button class="adm-new" id="adm-new" type="button">new</button>
      </div>
      <p class="adm-summary" id="adm-summary"></p>
      <ul class="adm-list" id="adm-list"></ul>
    </aside>

    <section class="adm-edit" id="adm-edit" hidden>
      <div class="adm-edit-left">
        <label class="adm-label">title
          <input class="adm-field" id="a-title" type="text" />
        </label>

        <label class="adm-label">slug <span class="adm-hint">changing this breaks existing links</span>
          <input class="adm-field" id="a-slug" type="text" spellcheck="false" />
        </label>

        <div class="adm-pair">
          <label class="adm-label">type
            <select class="adm-field" id="a-type"></select>
          </label>
          <label class="adm-label">city
            <select class="adm-field" id="a-city"></select>
          </label>
        </div>

        <div class="adm-pair">
          <label class="adm-label">venue
            <select class="adm-field" id="a-venue"></select>
          </label>
          <label class="adm-label">poster no
            <input class="adm-field" id="a-poster" type="number" min="1" />
          </label>
        </div>

        <label class="adm-label">meta <span class="adm-hint">shown on screen exactly as typed</span>
          <input class="adm-field" id="a-meta" type="text" />
        </label>

        <div class="adm-pair">
          <label class="adm-label">starts at
            <input class="adm-field" id="a-starts" type="datetime-local" />
          </label>
          <label class="adm-label adm-confirm">
            <input type="checkbox" id="a-estimated" />
            <span>date not verified</span>
          </label>
        </div>

        <label class="adm-label">body
          <textarea class="adm-field adm-long" id="a-body" rows="4"></textarea>
        </label>

        <label class="adm-label adm-confirm">
          <input type="checkbox" id="a-published" />
          <span>published</span>
        </label>

        <div class="adm-actions">
          <button class="adm-save" id="a-save" type="button">save</button>
          <button class="adm-delete" id="a-delete" type="button">delete</button>
          <span class="adm-status" id="a-status"></span>
        </div>
      </div>

      <div class="adm-edit-right">
        <p class="adm-label">poster</p>
        <div class="adm-poster" id="a-poster-preview"></div>
        <p class="adm-poster-note" id="a-poster-note"></p>

        <label class="adm-upload">
          <input type="file" id="a-poster-file" accept=".svg,image/svg+xml" hidden />
          <span>check an svg</span>
        </label>
        <button class="adm-poster-upload" id="a-poster-upload" type="button" hidden>
          use this poster
        </button>

        <p class="adm-label" style="margin-top: 26px">kept by</p>
        <p class="adm-number" id="a-number">—</p>
      </div>
    </section>

    <section class="adm-comments">
      <p class="adm-label">latest comments</p>
      <ul class="adm-comment-list" id="adm-comment-list"></ul>
    </section>

    <!-- Feedback: the writer cannot read it back, this is the only reader -->
    <section class="adm-feedback">
      <p class="adm-label">feedback <span class="adm-feedback-number" id="adm-feedback-number"></span></p>
      <ul class="adm-feedback-list" id="adm-feedback-list"></ul>
    </section>

  </main>

  <script src="../config.js?v=140"></script>
  <script src="../session.js?v=140"></script>
  <script src="../data.js?v=140"></script>
  <script src="admin.js?v=140"></script>

</body>
</html>
