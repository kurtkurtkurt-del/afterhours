<title>Tab Bar Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono&display=swap">
<style>
/* afterhours: ink on paper, one red. Single dark theme on purpose, like the app.
   Layout: a header, then ten small phones in a grid, each a working tab bar. */
:root {
  color-scheme: dark;
  --paper: #F3F1EC;
  --ink: #0E0D0C;
  --ink2: #1A1816;
  --ink3: #2A2724;
  --mute: #A9A59C;
  --meta: #7F7B73;
  --spot: #D7261E;
  --spot-text: #F0443A;
  --sans: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
html, body { min-height: 100%; }
body { background: var(--ink); color: var(--paper); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 48px; }
@media (max-width: 600px) { .wrap { padding-inline: 16px; } }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--meta); margin: 0 0 10px; }
h1 { font-size: 30px; font-weight: 600; letter-spacing: -0.5px; line-height: 1.1; margin: 0 0 8px; text-wrap: balance; }
.lede { color: var(--mute); max-width: 60ch; margin: 0 0 8px; }
.controls { display: flex; gap: 8px; margin: 14px 0 26px; flex-wrap: wrap; }
.ctl { all: unset; cursor: pointer; font-family: var(--mono); font-size: 11.5px; letter-spacing: .6px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--ink3); }
.ctl:hover { border-color: var(--meta); }
.ctl:focus-visible, button:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 28px 20px; }
.item h3 { font-size: 15px; font-weight: 600; margin: 12px 0 2px; display: flex; gap: 8px; align-items: baseline; }
.item h3 span { font-family: var(--mono); font-size: 11px; color: var(--meta); font-weight: 400; }
.item p { font-size: 13px; color: var(--mute); margin: 0; }
.new { font-family: var(--mono); font-size: 9.5px; letter-spacing: 1px; color: var(--spot-text); border: 1px solid var(--spot); border-radius: 999px; padding: 1px 7px; }

/* the phone */
.phone { position: relative; width: 240px; max-width: 100%; aspect-ratio: 240 / 460; border-radius: 30px; background: var(--ink); box-shadow: 0 0 0 7px #1c1a18, 0 0 0 8px #34302c; overflow: hidden; margin: 0 auto; user-select: none; }
.screen { position: absolute; inset: 0; }
.scene { position: absolute; inset: 0; padding: 38px 18px 0; opacity: 0; transform: translateY(8px); transition: opacity .35s, transform .35s; }
.scene.on { opacity: 1; transform: none; }
.scene .t { font-size: 24px; font-weight: 600; letter-spacing: -.8px; }
.scene .m { font-family: var(--mono); font-size: 9px; letter-spacing: 1px; color: var(--meta); text-transform: uppercase; margin-top: 2px; }
.poster { margin-top: 14px; height: 210px; border-radius: 16px; background: linear-gradient(160deg, #6b2a2a, #2a1a3a 60%, #0e0d0c); position: relative; }
.poster::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 8px; height: 56px; border-radius: 12px; background: var(--ink); }
.vinyl { margin: 22px auto 0; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, #6b5a8a 0 17%, #0e0d0c 18% 19%, #1d1b18 20% 100%); animation: spin 3s linear infinite; box-shadow: inset 0 0 0 20px #151311, inset 0 0 0 21px #25221e, inset 0 0 0 40px #151311, inset 0 0 0 41px #25221e; }
@keyframes spin { to { transform: rotate(360deg); } }
.squares { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.squares i { aspect-ratio: 1; border-radius: 9px; border: 1.5px solid var(--paper); }
.squares i:nth-child(2) { background: var(--spot); border-color: var(--spot); }
.mapbox { margin-top: 14px; height: 210px; border-radius: 16px; background: #141210; background-image: linear-gradient(#1f1c19 1px, transparent 1px), linear-gradient(90deg, #1f1c19 1px, transparent 1px); background-size: 22px 22px; position: relative; }
.mapbox::before { content: ""; position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px; border-radius: 50%; border: 1.5px solid var(--spot); }
.mapbox::after { content: ""; position: absolute; left: 40%; top: 36%; width: 8px; height: 8px; background: var(--paper); box-shadow: 30px 20px 0 var(--paper), -18px 40px 0 var(--spot), 44px -14px 0 var(--paper); }
.me { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; margin-top: 18px; }
.me .av { width: 70px; height: 70px; border-radius: 22px; background: linear-gradient(135deg, #8a5a3a, #3a2a4a); }
.me .ln { height: 8px; border-radius: 4px; background: var(--ink3); }
.home { position: absolute; bottom: 5px; left: 50%; width: 80px; height: 3px; margin-left: -40px; border-radius: 3px; background: var(--paper); opacity: .6; z-index: 20; }
svg.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* 1 · ticket stub */
.ticket { position: absolute; left: 12px; right: 12px; bottom: 16px; height: 52px; background: var(--paper); border-radius: 12px; display: flex; color: var(--ink); z-index: 10; }
.ticket::before, .ticket::after { content: ""; position: absolute; top: 19px; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); }
.ticket::before { left: -7px; } .ticket::after { right: -7px; }
.ticket .words { flex: 1; display: flex; justify-content: space-around; align-items: center; position: relative; }
.ticket button { all: unset; cursor: pointer; font-family: var(--mono); font-size: 10.5px; color: #8a857c; padding: 6px 2px; transition: color .25s; }
.ticket button.on { color: var(--ink); font-weight: 500; }
.ticket .ul { position: absolute; bottom: 12px; height: 2px; background: var(--spot); transition: left .35s cubic-bezier(.2,.8,.2,1), width .35s; }
.ticket .stub { all: unset; cursor: pointer; width: 56px; border-left: 2px dashed var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: background .3s, color .3s; border-radius: 0 12px 12px 0; }
.ticket .stub small { font-family: var(--mono); font-size: 8px; color: #8a857c; }
.ticket .stub b { font-size: 13px; color: var(--spot); }
.ticket .stub.on { background: var(--spot); } .ticket .stub.on b, .ticket .stub.on small { color: var(--paper); }

/* 2 · words */
.words2 { position: absolute; left: 16px; right: 16px; bottom: 18px; display: flex; align-items: baseline; justify-content: space-between; z-index: 10; border-bottom: 1px solid var(--ink3); padding-bottom: 10px; }
.words2 button { all: unset; cursor: pointer; font-size: 12.5px; color: var(--meta); transition: font-size .3s cubic-bezier(.2,.8,.2,1), color .3s, letter-spacing .3s; }
.words2 button.on { font-size: 22px; color: var(--paper); font-weight: 600; letter-spacing: -.8px; }
.words2 button.on::after { content: "."; color: var(--spot); }

/* 3 · fan */
.fanDim { position: absolute; inset: 0; background: rgba(14,13,12,.6); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 9; }
.fan.open .fanDim { opacity: 1; pointer-events: auto; }
.fanBtn { all: unset; cursor: pointer; position: absolute; left: 50%; bottom: 16px; width: 54px; height: 54px; margin-left: -27px; border-radius: 50%; background: var(--spot); color: var(--paper); display: grid; place-items: center; z-index: 12; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.fan.open .fanBtn { transform: rotate(135deg); }
.fanItem { all: unset; cursor: pointer; position: absolute; left: 50%; bottom: 21px; width: 42px; height: 42px; margin-left: -21px; border-radius: 50%; background: var(--ink2); border: 1px solid var(--ink3); color: var(--paper); display: grid; place-items: center; z-index: 11; opacity: 0; transform: translate(0,0) scale(.4); transition: transform .4s cubic-bezier(.2,.9,.3,1.25), opacity .25s; }
.fanItem.on { background: var(--paper); color: var(--ink); }
.fanItem span { position: absolute; top: 46px; font-size: 9.5px; font-family: var(--mono); color: var(--mute); white-space: nowrap; }

/* 4 · island */
.island { all: unset; cursor: pointer; position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); height: 44px; border-radius: 999px; background: var(--ink); border: 1px solid var(--ink3); display: flex; align-items: center; padding: 0 10px 0 5px; gap: 8px; z-index: 10; white-space: nowrap; transition: width .4s cubic-bezier(.2,.8,.2,1); overflow: hidden; }
.island .dot { width: 34px; height: 34px; border-radius: 50%; background: var(--paper); color: var(--ink); display: grid; place-items: center; flex: none; }
.island b { font-size: 13.5px; font-weight: 500; }
.island small { font-size: 11px; color: var(--meta); }
.island .row { display: none; gap: 4px; }
.island.open { padding: 0 5px; }
.island.open .one { display: none; }
.island.open .row { display: flex; }
.island .row i { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--mute); font-style: normal; }
.island .row i.on { background: var(--paper); color: var(--ink); }

/* 5 · split dock */
.dock { position: absolute; left: 12px; right: 12px; bottom: 16px; height: 56px; display: flex; align-items: center; justify-content: space-between; z-index: 10; }
.pair { display: flex; gap: 3px; padding: 4px; border-radius: 999px; background: var(--ink2); }
.pair button, .dock .mid { all: unset; cursor: pointer; }
.pair button { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--mute); transition: background .25s, color .25s; }
.pair button.on { background: var(--paper); color: var(--ink); }
.dock .mid { width: 56px; height: 56px; border-radius: 18px; background: var(--spot); color: var(--paper); display: grid; place-items: center; transition: transform .3s, box-shadow .3s; }
.dock .mid.on { box-shadow: 0 0 0 3px var(--ink), 0 0 0 5px var(--paper); transform: translateY(-3px); }

/* 6 · rotary dial */
.dial { position: absolute; left: 50%; bottom: -120px; width: 240px; height: 240px; margin-left: -120px; border-radius: 50%; background: var(--ink2); border: 1px solid var(--ink3); z-index: 10; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
.dial button { all: unset; cursor: pointer; position: absolute; left: 50%; top: 50%; font-family: var(--mono); font-size: 10.5px; color: var(--meta); transform-origin: 0 0; }
.dial button.on { color: var(--paper); }
.needle { position: absolute; left: 50%; bottom: 106px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--spot); z-index: 11; }
.dialCap { position: absolute; left: 50%; bottom: 14px; margin-left: -34px; width: 68px; text-align: center; z-index: 11; font-size: 13px; font-weight: 600; }

/* 7 · edge rail */
.rail { position: absolute; right: 8px; bottom: 60px; display: flex; flex-direction: column; gap: 4px; padding: 5px; border-radius: 999px; background: var(--ink2); border: 1px solid var(--ink3); z-index: 10; }
.rail button { all: unset; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--mute); position: relative; transition: background .25s, color .25s; }
.rail button.on { background: var(--paper); color: var(--ink); }
.rail button .tip { position: absolute; right: 44px; background: var(--paper); color: var(--ink); font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 999px; opacity: 0; transform: translateX(8px); transition: opacity .3s, transform .3s; pointer-events: none; white-space: nowrap; }
.rail button.on .tip { opacity: 1; transform: none; }

/* 8 · cassette keys */
.keys { position: absolute; left: 10px; right: 10px; bottom: 14px; display: flex; gap: 4px; padding: 6px; border-radius: 12px; background: #1a1714; border: 1px solid #3a352d; z-index: 10; }
.keys button { all: unset; cursor: pointer; flex: 1; height: 42px; border-radius: 6px; background: #d9d4c9; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 5px 0 #8f887c; transform: translateY(-3px); transition: transform .12s, box-shadow .12s, background .2s; }
.keys button small { font-family: var(--mono); font-size: 8px; }
.keys button.on { transform: translateY(2px); box-shadow: 0 0 0 #8f887c; background: #bfb8ab; }
.keys button::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: #5a544a; }
.keys button.on::before { background: var(--spot); box-shadow: 0 0 6px var(--spot); }

/* 9 · ink blob */
.blobbar { position: absolute; left: 12px; right: 12px; bottom: 16px; height: 54px; border-radius: 999px; background: var(--ink2); border: 1px solid var(--ink3); display: flex; z-index: 10; }
.blob { position: absolute; top: -12px; width: 46px; height: 46px; border-radius: 50%; background: var(--spot); transition: left .45s cubic-bezier(.3,1.4,.5,1), transform .45s; }
.blobbar button { all: unset; cursor: pointer; flex: 1; display: grid; place-items: center; color: var(--mute); position: relative; z-index: 1; transition: transform .45s cubic-bezier(.3,1.4,.5,1), color .3s; }
.blobbar button.on { color: var(--paper); transform: translateY(-12px); }

/* 10 · card tabs */
.cardtabs { position: absolute; left: 0; right: 0; bottom: 0; height: 76px; z-index: 10; }
.cardtabs button { all: unset; cursor: pointer; position: absolute; bottom: -40px; width: 44px; height: 84px; border-radius: 12px 12px 0 0; background: var(--ink2); border: 1px solid var(--ink3); color: var(--mute); text-align: center; padding-top: 8px; box-sizing: border-box; font-size: 10px; font-weight: 500; transition: bottom .35s cubic-bezier(.2,.8,.2,1), background .3s, color .3s; }
.cardtabs button.on { bottom: -12px; background: var(--paper); color: var(--ink); z-index: 2; }
.cardtabs button.on::after { content: ""; display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--spot); margin: 4px auto 0; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>

<main class="wrap">
  <p class="eyebrow">afterhours · alt navigasyon · öneriler</p>
  <h1>On alt bar, hepsi çalışıyor</h1>
  <p class="lede">Her telefon kendi kendine sekmeler arasında geziyor. Birine dokunduğunda o telefon durur ve senin elinde kalır; sekmelere basıp dene. İlk beşi önceki öneriler, son beşi yeni.</p>
  <div class="controls">
    <button class="ctl" id="toggle">otomatik gezintiyi durdur</button>
    <button class="ctl" id="reset">baştan başlat</button>
  </div>
  <div class="grid" id="grid"></div>
</main>

<script>
const TABS = [
  { id: 'flow', label: 'flow', word: 'flow', meta: 'münchen · 54 gece' },
  { id: 'djs', label: 'djs', word: 'djs', meta: 'şu an: levent ok' },
  { id: 'yours', label: 'yours', word: 'yours', meta: '3 arkadaş dışarıda' },
  { id: 'map', label: 'map', word: 'map', meta: '3 km içinde 12 gece' },
  { id: 'me', label: 'me', word: 'me', meta: 'ahmet · 14 kart' },
];
const ICON = {
  flow: '<svg class="ic" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="16" rx="3"/><path d="M3 7v10M21 7v10"/></svg>',
  djs: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.2"/></svg>',
  yours: '<svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="9" r="3"/><circle cx="16.5" cy="10" r="2.4"/><path d="M3.5 19c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5M14.5 15.2c.6-.3 1.3-.5 2-.5 2 0 3.6 1.3 4 4.3"/></svg>',
  map: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.9-6.5-11a6.5 6.5 0 0113 0c0 5.1-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>',
  me: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.5 20c1.2-3.6 4.2-5.2 7.5-5.2s6.3 1.6 7.5 5.2"/></svg>',
};
const SCENES = {
  flow: '<div class="poster"></div>',
  djs: '<div class="vinyl"></div>',
  yours: '<div class="squares"><i></i><i></i><i></i><i></i><i></i><i></i></div>',
  map: '<div class="mapbox"></div>',
  me: '<div class="me"><div class="av"></div><div class="ln" style="width:120px"></div><div class="ln" style="width:80px"></div></div>',
};

// each design: how the bar is drawn, and how it shows the active tab
const DESIGNS = [
  { n: 1, name: 'Bilet koçanı', say: 'Kâğıt bilet; sekmeler daktilo yazısı, kırmızı çizgi kayar. Koçan yours.', build: ticket },
  { n: 2, name: 'Kelime çubuğu', say: 'İkon yok. Seçili kelime büyür, yanında kırmızı nokta.', build: words },
  { n: 3, name: 'Tek düğme, yelpaze', say: 'Kırmızı düğmeye bas, beş sekme yarım daire açılır.', build: fan },
  { n: 4, name: 'Dinamik ada', say: 'Kapsül bulunduğun yeri ve bağlamını söyler; dokun, beşi açılır.', build: island },
  { n: 5, name: 'Bölünmüş dok', say: 'İki küçük hap, ortada kırmızı yours karesi.', build: dock },
  { n: 6, name: 'Döner kadran', say: 'Yarım disk; seçtiğin sekme kırmızı iğnenin altına döner.', build: dial, isNew: true },
  { n: 7, name: 'Kenar rayı', say: 'Başparmağın olduğu sağ kenarda dikey ray; seçilinin adı yandan çıkar.', build: rail, isNew: true },
  { n: 8, name: 'Kaset tuşları', say: 'Eski teyp tuşları: basılı kalan sekme, kırmızı ışık yanar.', build: keys, isNew: true },
  { n: 9, name: 'Mürekkep damlası', say: 'Kırmızı damla sekmeden sekmeye zıplar, ikonu yukarı kaldırır.', build: blob, isNew: true },
  { n: 10, name: 'Kart sekmeleri', say: 'Alttan uç veren kartlar; seçilen kart yukarı çıkar.', build: cards, isNew: true },
];

let auto = !matchMedia('(prefers-reduced-motion: reduce)').matches;
const phones = [];

function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }

function makePhone(design, idx) {
  const item = el(`<div class="item"><div class="phone"><div class="screen"></div><div class="home"></div></div>
    <h3>${design.name} <span>${design.n}</span>${design.isNew ? '<em class="new">YENİ</em>' : ''}</h3><p>${design.say}</p></div>`);
  const phone = item.querySelector('.phone');
  const screen = item.querySelector('.screen');
  TABS.forEach((t) => screen.appendChild(el(`<div class="scene" data-s="${t.id}"><div class="t">${t.word}</div><div class="m">${t.meta}</div>${SCENES[t.id]}</div>`)));
  const state = { tab: 'flow', manual: false, phone, set: null };
  const show = (id) => {
    state.tab = id;
    screen.querySelectorAll('.scene').forEach((s) => s.classList.toggle('on', s.dataset.s === id));
    bar.update(id);
  };
  const choose = (id) => { state.manual = true; show(id); };
  const bar = design.build(phone, choose);
  state.set = show;
  // the auto tour also plays the bar's own gesture (the fan opening, the island expanding)
  state.auto = (id) => { show(id); bar.demo?.(id); };
  phone.addEventListener('pointerdown', () => { state.manual = true; });
  show('flow');
  phones.push({ state, idx });
  return item;
}

// ---------- designs
function ticket(phone, choose) {
  const t = el(`<div class="ticket"><div class="words">${TABS.filter((x) => x.id !== 'yours').map((x) => `<button data-t="${x.id}">${x.label}</button>`).join('')}<div class="ul"></div></div><button class="stub" data-t="yours"><small>no.</small><b>yours</b></button></div>`);
  phone.appendChild(t);
  t.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => choose(b.dataset.t));
  const ul = t.querySelector('.ul');
  return { update(id) {
    t.querySelectorAll('[data-t]').forEach((b) => b.classList.toggle('on', b.dataset.t === id));
    const b = t.querySelector(`.words [data-t="${id}"]`);
    if (b) { ul.style.opacity = 1; ul.style.left = b.offsetLeft + 'px'; ul.style.width = b.offsetWidth + 'px'; } else ul.style.opacity = 0;
  } };
}
function words(phone, choose) {
  const w = el(`<div class="words2">${TABS.map((x) => `<button data-t="${x.id}">${x.word}</button>`).join('')}</div>`);
  phone.appendChild(w);
  w.querySelectorAll('button').forEach((b) => b.onclick = () => choose(b.dataset.t));
  return { update(id) { w.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.t === id)); } };
}
function fan(phone, choose) {
  const box = el(`<div class="fan"><div class="fanDim"></div>${TABS.map((x) => `<button class="fanItem" data-t="${x.id}">${ICON[x.id]}<span>${x.label}</span></button>`).join('')}<button class="fanBtn" aria-label="menü"></button></div>`);
  phone.appendChild(box);
  const btn = box.querySelector('.fanBtn');
  const items = [...box.querySelectorAll('.fanItem')];
  let open = false, cur = 'flow';
  const place = () => {
    box.classList.toggle('open', open);
    items.forEach((it, i) => {
      const a = Math.PI * (1 - i / (items.length - 1));
      const r = 92;
      it.style.transform = open ? `translate(${Math.cos(a) * r}px, ${-Math.sin(a) * r - 6}px) scale(1)` : 'translate(0,0) scale(.4)';
      it.style.opacity = open ? 1 : 0;
      it.style.transitionDelay = open ? `${i * 40}ms` : '0ms';
      it.style.pointerEvents = open ? 'auto' : 'none';
    });
    btn.innerHTML = open ? '<svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>' : ICON[cur];
  };
  btn.onclick = () => { open = !open; place(); };
  box.querySelector('.fanDim').onclick = () => { open = false; place(); };
  items.forEach((it) => it.onclick = () => { open = false; choose(it.dataset.t); });
  return { update(id) { cur = id; items.forEach((it) => it.classList.toggle('on', it.dataset.t === id)); place(); }, demo(id) { open = true; place(); setTimeout(() => { open = false; cur = id; place(); }, 700); } };
}
function island(phone, choose) {
  const b = el(`<button class="island"><span class="one" style="display:flex;align-items:center;gap:8px"><span class="dot"></span><b></b><small></small><svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px;color:var(--meta)"><path d="M6 15l6-6 6 6"/></svg></span><span class="row">${TABS.map((x) => `<i data-t="${x.id}">${ICON[x.id]}</i>`).join('')}</span></button>`);
  phone.appendChild(b);
  let open = false;
  b.onclick = (e) => {
    const t = e.target.closest('[data-t]');
    if (open && t) { open = false; b.classList.remove('open'); choose(t.dataset.t); return; }
    open = !open; b.classList.toggle('open', open);
  };
  return { update(id) {
    const t = TABS.find((x) => x.id === id);
    b.querySelector('.dot').innerHTML = ICON[id]; b.querySelector('b').textContent = t.label; b.querySelector('small').textContent = t.meta;
    b.querySelectorAll('.row i').forEach((i) => i.classList.toggle('on', i.dataset.t === id));
  }, demo(id) { b.classList.add('open'); setTimeout(() => b.classList.remove('open'), 700); } };
}

  phone.appendChild(d);
  d.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => choose(b.dataset.t));
  return { update(id) { d.querySelectorAll('[data-t]').forEach((b) => b.classList.toggle('on', b.dataset.t === id)); } };
}
function dial(phone, choose) {
  const d = el(`<div class="dial">${TABS.map((x, i) => `<button data-t="${x.id}" data-i="${i}">${x.label}</button>`).join('')}</div>`);
  phone.appendChild(d); phone.appendChild(el('<div class="needle"></div>'));
  const cap = el('<div class="dialCap"></div>'); phone.appendChild(cap);
  const step = 34; // degrees between labels
  d.querySelectorAll('button').forEach((b) => {
    const i = +b.dataset.i, a = (-90 + (i - 2) * step) * Math.PI / 180, r = 96;
    b.style.transform = `translate(${Math.cos(a) * r}px, ${Math.sin(a) * r}px) rotate(${(i - 2) * step}deg) translate(-50%, -50%)`;
    b.onclick = () => choose(b.dataset.t);
  });
  return { update(id) {
    const i = TABS.findIndex((x) => x.id === id);
    d.style.transform = `rotate(${-(i - 2) * step}deg)`;
    d.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.t === id));
    cap.textContent = '';
  } };
}

// ---------- build and auto tour
const grid = document.getElementById('grid');
DESIGNS.forEach((d, i) => grid.appendChild(makePhone(d, i)));
requestAnimationFrame(() => phones.forEach((p) => p.state.set(p.state.tab)));  // place underlines after layout

let tick = 0;
setInterval(() => {
  if (!auto) return;
  tick++;
  phones.forEach((p) => {
    if (p.state.manual) return;
    if ((tick + p.idx) % 2) return;  // stagger
    const i = TABS.findIndex((t) => t.id === p.state.tab);
    p.state.auto(TABS[(i + 1) % TABS.length].id);
  });
}, 1400);

const toggle = document.getElementById('toggle');
toggle.onclick = () => { auto = !auto; toggle.textContent = auto ? 'otomatik gezintiyi durdur' : 'otomatik gezintiyi başlat'; };
if (!auto) toggle.textContent = 'otomatik gezintiyi başlat';
document.getElementById('reset').onclick = () => { phones.forEach((p) => { p.state.manual = false; p.state.set('flow'); }); auto = true; toggle.textContent = 'otomatik gezintiyi durdur'; };
</script>
