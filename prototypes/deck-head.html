<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deck başlığı · 5 tasarım</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root {
    --ground: #F6F4EF; --card: #FFFFFF; --text: #1F1D1A; --mute: #7A766E; --meta: #9A958C; --hair: #E3DFD6;
    --spot: #D7261E; --spotText: #D7261E; --poster: #0E0D0C; --onPhoto: #F6F4EF;
    --sans: "Inter Tight", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --logo: "ArchivoLogo", "Archivo", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1b1a18; font-family: var(--sans); color: #F3F1EC; padding: 32px 16px 120px; }
  header.page { max-width: 1560px; margin: 0 auto 28px; }
  header.page h1 { font-family: var(--logo); font-weight: 900; font-size: 38px; letter-spacing: -1px; }
  header.page h1 b { color: var(--spot); }
  header.page p { color: #A9A59C; font-size: 14px; margin-top: 8px; max-width: 820px; line-height: 1.55; }
  header.page p b { color: #F3F1EC; font-weight: 500; }
  .row5 { max-width: 1560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 280px); gap: 22px; overflow-x: auto; padding: 4px 4px 12px; scroll-snap-type: x mandatory; }
  figure { scroll-snap-align: start; cursor: pointer; }
  figcaption { margin-top: 12px; font-size: 13px; line-height: 1.45; color: #A9A59C; }
  figcaption b { display: block; color: #F3F1EC; font-weight: 500; font-size: 14px; margin-bottom: 2px; }
  figcaption i { display: block; font-style: normal; color: #7F7B73; margin-top: 4px; font-size: 12px; }
  figure.picked .ph { box-shadow: 0 0 0 3px var(--spot), 0 20px 40px rgba(0,0,0,.45); }
  figure.picked figcaption b::after { content: "  ✓ seçildi"; color: #F0443A; font-family: var(--mono); font-size: 10px; letter-spacing: 1px; }

  /* the phone */
  .ph { width: 280px; height: 600px; border-radius: 30px; overflow: hidden; position: relative; background: var(--ground); color: var(--text);
        box-shadow: 0 0 0 6px #000, 0 20px 40px rgba(0,0,0,.45); font-size: 13px; }
  .sb { height: 26px; display: flex; justify-content: space-between; align-items: center; padding: 0 18px; font-size: 10.5px; font-weight: 600; }
  .snd { position: absolute; top: 34px; right: 14px; font-size: 10px; color: var(--text); display: flex; gap: 5px; align-items: center; }
  .snd::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--spot); }
  .grip { display: flex; flex-direction: column; align-items: center; gap: 1px; padding-top: 4px; }
  .grip .h { width: 40px; height: 4px; border-radius: 3px; background: var(--text); }
  .grip svg { width: 14px; height: 8px; }

  /* the card under every head: the same, so only the head differs */
  .poster { position: absolute; left: 50%; transform: translateX(-50%); width: 176px; height: 246px; border-radius: 14px; overflow: hidden; background: var(--poster) center/cover; }
  .poster .tag { position: absolute; left: 8px; top: 8px; background: var(--card); color: var(--text); border-radius: 8px; padding: 3px 7px; font-family: var(--logo); font-weight: 900; font-size: 11px; }
  .poster .tag span { font-family: var(--sans); font-weight: 500; font-size: 9px; margin-left: 4px; }
  .cap { position: absolute; left: 8px; right: 8px; height: 104px; border-radius: 18px; border: 1px solid var(--hair); background: var(--card); display: flex; overflow: hidden; }
  .cap .l { width: 24px; border-right: 1px solid var(--hair); writing-mode: vertical-rl; transform: rotate(180deg); font-family: var(--mono); font-size: 7px; letter-spacing: 1px; text-align: center; color: var(--text); }
  .cap .m { flex: 1; padding: 10px 10px; }
  .cap .m .t { font-family: var(--logo); font-weight: 900; font-size: 15px; line-height: 15px; color: var(--spot); text-transform: lowercase; }
  .cap .m .v { font-size: 10px; margin-top: 4px; }
  .cap .m .k { display: flex; align-items: center; gap: 6px; margin-top: 7px; font-size: 9.5px; color: var(--mute); }
  .faces { display: flex; }
  .faces i { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--card); background: center/cover; margin-left: -6px; }
  .faces i:first-child { margin-left: 0; }
  .cap .r { width: 34px; background: var(--spot); color: #fff; writing-mode: vertical-rl; font-family: var(--mono); font-size: 8px; letter-spacing: 1.2px; text-align: center; }
  .acts { position: absolute; left: 0; right: 0; bottom: 56px; display: flex; justify-content: center; align-items: center; gap: 20px; }
  .acts i { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--hair); background: var(--card); display: grid; place-items: center; font-style: normal; font-size: 15px; }
  .acts i.s { width: 32px; height: 32px; font-size: 12px; opacity: .5; }
  .acts i.k { background: var(--spot); border-color: var(--spot); color: #fff; }
  .tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 44px; border-top: 1px solid var(--hair); display: flex; justify-content: space-around; align-items: center; background: var(--ground); }
  .tabs i { width: 16px; height: 16px; border: 1.6px solid var(--text); border-radius: 4px; }
  .tabs i.on { background: var(--text); }

  /* ---------- 1: title and a line */
  .h1 { padding: 8px 18px 0; }
  .h1 .name { font-family: var(--logo); font-weight: 900; font-size: 26px; letter-spacing: -0.4px; margin-top: 6px; }
  .h1 .name b { color: var(--spot); }
  .h1 .sub { font-family: var(--mono); font-size: 8.5px; letter-spacing: 1.3px; color: var(--meta); margin-top: 2px; }
  .h1 .f { display: flex; gap: 16px; margin-top: 10px; font-size: 13px; font-weight: 500; }
  .h1 .f span::after { content: " ▾"; color: var(--mute); font-size: 9px; }
  .h1 .f span.on { color: var(--spot); }
  .h1 .undo { position: absolute; right: 18px; top: 92px; font-size: 11px; color: var(--mute); }

  /* ---------- 2: one strip */
  .h2 { padding: 10px 14px 0; }
  .strip { display: flex; align-items: stretch; height: 38px; border-radius: 19px; background: var(--card); border: 1px solid var(--hair); margin-top: 6px; overflow: hidden; }
  .strip > div { display: flex; align-items: center; padding: 0 12px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .strip > div + div { border-left: 1px solid var(--hair); }
  .strip .who { flex: 1; gap: 7px; }
  .strip .who::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--spot); }
  .strip .who small { font-family: var(--mono); font-size: 8.5px; color: var(--meta); letter-spacing: 1px; font-weight: 400; }
  .strip .f::after { content: " ▾"; color: var(--mute); font-size: 9px; margin-left: 3px; }

  /* ---------- 3: story bar */
  .h3 { padding: 10px 14px 0; }
  .bars { display: flex; gap: 3px; margin-top: 4px; }
  .bars i { flex: 1; height: 3px; border-radius: 2px; background: var(--hair); }
  .bars i.d { background: var(--text); }
  .bars i.n { background: linear-gradient(90deg, var(--spot) 40%, var(--hair) 40%); }
  .h3 .r { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; }
  .h3 .r b { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
  .h3 .r span { font-family: var(--mono); font-size: 9px; letter-spacing: 1px; color: var(--meta); }
  .h3 .f { display: flex; gap: 14px; margin-top: 6px; font-size: 11.5px; color: var(--mute); }
  .h3 .f span { border-bottom: 1px dotted var(--mute); }

  /* ---------- 4: decks as tabs */
  .h4 { padding: 10px 0 0; }
  .h4 .tabsTop { display: flex; gap: 16px; padding: 6px 16px 0; overflow: hidden; border-bottom: 1px solid var(--hair); white-space: nowrap; }
  .h4 .tabsTop span { padding-bottom: 8px; font-size: 13px; font-weight: 500; color: var(--mute); }
  .h4 .tabsTop span.on { color: var(--text); box-shadow: inset 0 -2px 0 var(--spot); }
  .h4 .tabsTop span sup { font-family: var(--mono); font-size: 8px; margin-left: 2px; color: var(--meta); }
  .h4 .bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px 0; }
  .h4 .bar small { font-family: var(--mono); font-size: 8.5px; color: var(--meta); letter-spacing: 1.2px; }
  .h4 .ic { display: flex; gap: 8px; }
  .h4 .ic i { width: 28px; height: 28px; border-radius: 50%; background: var(--card); border: 1px solid var(--hair); display: grid; place-items: center; position: relative; }
  .h4 .ic i svg { width: 13px; height: 13px; }
  .h4 .ic i.on::after { content: ""; position: absolute; top: 1px; right: 1px; width: 7px; height: 7px; border-radius: 50%; background: var(--spot); border: 1.5px solid var(--ground); }

  /* ---------- 5: a sentence */
  .h5 { padding: 10px 18px 0; }
  .h5 .s { font-size: 19px; line-height: 24px; font-weight: 500; letter-spacing: -0.4px; margin-top: 6px; }
  .h5 .s u { text-decoration: none; color: var(--spot); border-bottom: 1.5px solid var(--spot); }
  .h5 .s em { font-style: normal; color: var(--mute); }
  .h5 .p { font-family: var(--mono); font-size: 8.5px; letter-spacing: 1.2px; color: var(--meta); margin-top: 6px; }

  /* the special deck variant: photo ground */
  .ph.sp { background: #1d1410; color: #F6F4EF; }
</style>
</head>
<body>
<header class="page">
  <h1>deck başlığı<b>.</b></h1>
  <p>Friends deck, waves ve specialties açılınca üstte duran kısım. Şimdiki hali: üç ayrı kutu (deck adı · sayı, <b>all events</b>, <b>any time</b>). Aşağıda beş yalın alternatif; kart ve düğmeler hepsinde aynı, yalnız baş değişiyor. <b>Birine dokun, seç</b>; numarasını söylemen yeter.</p>
</header>
