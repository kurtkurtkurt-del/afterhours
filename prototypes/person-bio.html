<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>afterhours — profil sayfası, 5 öneri</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root {
    --paper: #F3F1EC; --paper2: #FAF9F6; --ink: #0E0D0C; --ink2: #6C6961;
    --rule: #D9D5CC; --spot: #D7261E; --spotText: #F0443A; --ink3: #2A2724;
    --mute: #A9A59C; --meta: #7F7B73;
    --sans: "Inter Tight", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --logo: "ArchivoLogo", "Archivo", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1b1a18; font-family: var(--sans); color: var(--paper); padding: 40px 32px 80px; }
  header.page { max-width: 1900px; margin: 0 auto 36px; }
  header.page h1 { font-weight: 500; font-size: 28px; letter-spacing: -0.8px; }
  header.page p { color: var(--mute); font-size: 14px; margin-top: 6px; max-width: 720px; line-height: 1.5; }
  .row { display: flex; flex-wrap: wrap; gap: 40px 24px; justify-content: center; max-width: 1900px; margin: 0 auto; }
  figure { width: 360px; }
  figcaption { margin-top: 16px; }
  figcaption b { display: block; font-weight: 500; font-size: 17px; letter-spacing: -0.3px; }
  figcaption span { display: block; font-size: 13px; line-height: 1.5; color: var(--mute); margin-top: 4px; }
  figcaption i { font-style: normal; font-family: var(--mono); font-size: 10px; letter-spacing: 1.2px; color: var(--spotText); }

  /* the phone */
  .phone { width: 360px; height: 760px; border-radius: 34px; overflow: hidden; position: relative; background: var(--ink); box-shadow: 0 0 0 8px #000, 0 30px 60px rgba(0,0,0,.5); }
  .phone .scroll { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; }
  .phone .scroll::-webkit-scrollbar { display: none; }
  .bar { height: 34px; display: flex; justify-content: space-between; align-items: center; padding: 0 22px; font-size: 12px; font-weight: 500; }
  .band { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
  .back { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; }
  .snd { font-family: var(--mono); font-size: 9px; letter-spacing: 1.4px; }
  .mono { font-family: var(--mono); font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; }
  .btn { display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 14px; font-weight: 500; font-size: 15px; background: var(--spot); color: var(--paper); }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--spot); vertical-align: middle; }

  /* ---------- 1 · giriş bileti ---------- */
  .v1 .scroll { padding-bottom: 30px; }
  .v1 .back { border: 1px solid var(--ink3); color: var(--paper); }
  .v1 .snd { color: var(--mute); }
  .v1 .ticket { margin: 6px 16px 0; background: var(--paper); color: var(--ink); border-radius: 18px; position: relative; }
  .v1 .t-top { padding: 20px 20px 18px; display: grid; grid-template-columns: 58px 1fr; gap: 14px; align-items: center; }
  .v1 .init { width: 58px; height: 58px; border-radius: 12px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-weight: 500; font-size: 28px; }
  .v1 .name { font-weight: 500; font-size: 27px; letter-spacing: -0.9px; line-height: 1; }
  .v1 .handle { color: var(--meta); margin-top: 7px; }
  .v1 .bio { padding: 0 20px 18px; font-size: 15px; line-height: 21px; }
  .v1 .perf { position: relative; height: 0; border-top: 1.5px dashed var(--rule); margin: 0 14px; }
  .v1 .perf::before, .v1 .perf::after { content: ""; position: absolute; top: -11px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); }
  .v1 .perf::before { left: -26px; } .v1 .perf::after { right: -26px; }
  .v1 .stub { display: grid; grid-template-columns: repeat(3, 1fr); padding: 16px 20px 18px; }
  .v1 .stub div + div { border-left: 1px solid var(--rule); padding-left: 14px; }
  .v1 .stub small { display: block; font-family: var(--mono); font-size: 9px; letter-spacing: 1.3px; color: var(--meta); }
  .v1 .stub b { display: block; font-family: var(--mono); font-weight: 500; font-size: 20px; margin-top: 4px; letter-spacing: -0.5px; }
  .v1 .code { display: flex; gap: 2px; height: 26px; margin: 0 20px 18px; }
  .v1 .code span { background: var(--ink); flex: 1; }
  .v1 .both { margin: 18px 16px 0; display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; padding: 10px; border: 1px solid var(--ink3); border-radius: 14px; }
  .v1 .both img { width: 56px; height: 72px; object-fit: cover; border-radius: 6px; }
  .v1 .both .mono { color: var(--spotText); font-size: 9px; }
  .v1 .both b { display: block; font-weight: 500; font-size: 17px; margin-top: 3px; }
  .v1 .both span { font-size: 13px; color: var(--mute); }
  .v1 .act { margin: 14px 16px 0; }
  .v1 .links { display: flex; gap: 8px; margin: 14px 16px 0; flex-wrap: wrap; }
  .v1 .links a { font-size: 13px; color: var(--paper); border: 1px solid var(--ink3); border-radius: 999px; padding: 7px 12px; text-decoration: none; }

  /* ---------- 2 · afiş ---------- */
  .v2 { background: var(--paper); }
  .v2 .hero { position: relative; height: 380px; background: #efeae0; overflow: hidden; }
  .v2 .hero img.bg { position: absolute; left: -20px; top: -110px; width: 400px; height: 600px; }
  .v2 .hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(180deg, rgba(243,241,236,0), rgba(243,241,236,.92) 70%); }
  .v2 .title { z-index: 1; }
  .v2 .hero .bar, .v2 .hero .band { position: relative; color: var(--ink); }
  .v2 .back { background: var(--paper); color: var(--ink); }
  .v2 .snd { color: var(--ink); }
  .v2 .title { position: absolute; left: 18px; right: 18px; bottom: 18px; color: var(--ink); }
  .v2 .title .mono { font-size: 10px; color: var(--ink); }
  .v2 .title h2 { font-family: var(--logo); font-weight: 900; font-size: 74px; line-height: .82; letter-spacing: -2px; margin-top: 8px; }
  .v2 .credits { padding: 18px; color: var(--ink); display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; border-bottom: 1px solid var(--rule); }
  .v2 .credits small { display: block; font-family: var(--mono); font-size: 9px; letter-spacing: 1.3px; color: var(--meta); text-transform: uppercase; }
  .v2 .credits b { font-weight: 500; font-size: 15px; }
  .v2 .bio { padding: 18px 18px 0; color: var(--ink); font-weight: 500; font-size: 21px; line-height: 25px; letter-spacing: -0.5px; }
  .v2 .about { padding: 8px 18px 0; color: var(--ink2); font-size: 14px; line-height: 20px; }
  .v2 .act { padding: 18px; display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .v2 .act .ghost { width: 48px; height: 48px; border-radius: 14px; border: 1px solid var(--rule); display: grid; place-items: center; color: var(--ink); font-size: 16px; }

  /* ---------- 3 · line-up ---------- */
  .v3 .back { border: 1px solid var(--ink3); }
  .v3 .snd { color: var(--mute); }
  .v3 .head { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 6px 16px 0; }
  .v3 .head .init { width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid var(--paper); display: grid; place-items: center; font-weight: 500; font-size: 24px; }
  .v3 .head b { display: block; font-weight: 500; font-size: 21px; letter-spacing: -0.5px; line-height: 1.05; }
  .v3 .head .mono { color: var(--mute); font-size: 9px; margin-top: 4px; display: block; }
  .v3 .pill { background: var(--spot); color: var(--paper); border-radius: 999px; padding: 9px 14px; font-weight: 500; font-size: 13px; }
  .v3 .bio { padding: 14px 16px 0; font-size: 15px; line-height: 21px; }
  .v3 .facts { display: flex; gap: 16px; padding: 12px 16px 16px; color: var(--mute); border-bottom: 1px solid var(--ink3); }
  .v3 .facts b { color: var(--paper); font-weight: 500; }
  .v3 .lu-h { display: flex; justify-content: space-between; padding: 18px 16px 6px; color: var(--meta); }
  .v3 .lu { list-style: none; }
  .v3 .lu li { display: grid; grid-template-columns: 54px 1fr auto; align-items: baseline; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--ink3); }
  .v3 .lu .d { font-family: var(--mono); font-size: 11px; color: var(--mute); }
  .v3 .lu .t { font-weight: 500; font-size: 22px; letter-spacing: -0.7px; line-height: 1.05; }
  .v3 .lu .v { font-family: var(--mono); font-size: 9px; letter-spacing: 1.2px; color: var(--mute); text-transform: uppercase; text-align: right; }
  .v3 .lu li.you .t::after { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--spot); margin-left: 8px; vertical-align: middle; }
  .v3 .lu li.past .t { color: var(--ink2); }
  .v3 .legend { padding: 10px 16px 0; color: var(--meta); font-size: 9px; }
  .v3 .else { padding: 18px 16px 30px; display: flex; gap: 18px; font-size: 14px; }
  .v3 .else a { color: var(--paper); text-decoration: none; border-bottom: 1px solid var(--ink3); padding-bottom: 2px; }

  /* ---------- 4 · damga ---------- */
  .v4 { background: var(--paper); color: var(--ink); }
  .v4 .back { border: 1px solid var(--rule); color: var(--ink); }
  .v4 .snd { color: var(--ink2); }
  .v4 .top { display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: center; padding: 4px 16px 0; }
  .v4 .stamp { width: 150px; height: 150px; transform: rotate(-9deg); mix-blend-mode: multiply; opacity: .92; }
  .v4 .who b { display: block; font-weight: 500; font-size: 28px; letter-spacing: -0.9px; line-height: 1; }
  .v4 .who .mono { display: block; color: var(--meta); margin-top: 8px; font-size: 9px; }
  .v4 .who .bio { font-size: 14px; line-height: 19px; margin-top: 10px; }
  .v4 .count { display: grid; grid-template-columns: repeat(3, 1fr); margin: 16px 16px 0; border-top: 1.5px solid var(--ink); border-bottom: 1px solid var(--rule); }
  .v4 .count div { padding: 10px 0 11px; }
  .v4 .count div + div { padding-left: 12px; border-left: 1px solid var(--rule); }
  .v4 .count b { display: block; font-weight: 500; font-size: 22px; letter-spacing: -0.6px; }
  .v4 .count small { font-family: var(--mono); font-size: 9px; letter-spacing: 1.2px; color: var(--meta); text-transform: uppercase; }
  .v4 .sec { display: flex; justify-content: space-between; padding: 18px 16px 8px; color: var(--meta); }
  .v4 .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 16px; }
  .v4 .grid figure, .v4 .grid div { width: auto; }
  .v4 .grid .p { aspect-ratio: 2 / 3; border-radius: 8px; overflow: hidden; position: relative; background: #efeae0; }
  .v4 .grid .p img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .v4 .grid .p.both::after { content: "ikiniz de"; position: absolute; left: 6px; bottom: 6px; font-family: var(--mono); font-size: 8px; letter-spacing: 1px; background: var(--spot); color: var(--paper); padding: 3px 5px; border-radius: 4px; }
  .v4 .grid small { display: block; font-size: 12px; font-weight: 500; margin-top: 5px; }
  .v4 .act { padding: 18px 16px 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .v4 .act .btn:last-child { background: transparent; border: 1px solid var(--rule); color: var(--ink); }

  /* ---------- 5 · plak kabı ---------- */
  .v5 .back { border: 1px solid var(--ink3); }
  .v5 .snd { color: var(--mute); }
  .v5 .sleeve { position: relative; height: 220px; margin: 4px 16px 0; }
  .v5 .disc { position: absolute; top: 5px; right: 0; width: 210px; height: 210px; border-radius: 50%; background: repeating-radial-gradient(circle, #151413 0 2px, #1d1c1a 2px 4px); box-shadow: inset 0 0 0 1px #2a2724; }
  .v5 .disc::after { content: ""; position: absolute; inset: 72px; border-radius: 50%; background: var(--spot); box-shadow: 0 0 0 30px transparent; }
  .v5 .disc span { position: absolute; top: 0; bottom: 0; right: 0; width: 210px; display: grid; place-items: center; z-index: 1; font-family: var(--mono); font-size: 8px; letter-spacing: 1.2px; color: var(--paper); }
  .v5 .cover { position: absolute; top: 0; left: 0; width: 220px; height: 220px; border-radius: 6px; overflow: hidden; background: #222; box-shadow: 12px 0 30px rgba(0,0,0,.6); }
  .v5 .cover img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.15) brightness(.75); }
  .v5 .cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,13,12,0) 40%, rgba(14,13,12,.85)); }
  .v5 .cover .nm { position: absolute; left: 14px; right: 14px; bottom: 12px; z-index: 1; }
  .v5 .cover .nm b { display: block; font-family: var(--logo); font-weight: 900; font-size: 38px; line-height: .9; letter-spacing: -1px; }
  .v5 .cover .nm .mono { display: block; margin-top: 6px; font-size: 9px; color: var(--mute); }
  .v5 .bio { padding: 18px 16px 0; font-size: 15px; line-height: 21px; }
  .v5 .bio em { font-style: normal; color: var(--mute); display: block; font-size: 13px; margin-top: 6px; }
  .v5 .act { margin: 16px 16px 0; }
  .v5 .side { padding: 20px 16px 4px; display: flex; justify-content: space-between; color: var(--meta); }
  .v5 ol { list-style: none; padding: 0 16px; }
  .v5 ol li { display: grid; grid-template-columns: 30px 1fr auto; padding: 9px 0; border-bottom: 1px solid var(--ink3); align-items: baseline; }
  .v5 ol li .n { font-family: var(--mono); font-size: 10px; color: var(--spotText); }
  .v5 ol li .t { font-size: 15px; font-weight: 500; }
  .v5 ol li .d { font-family: var(--mono); font-size: 10px; color: var(--mute); }
  .v5 ol.b li .t { color: var(--ink2); }
  .v5 ol.b li .n { color: var(--meta); }
  .v5 .cred { padding: 18px 16px 30px; color: var(--mute); font-size: 12px; line-height: 19px; }
  .v5 .cred b { color: var(--paper); font-weight: 500; }
</style>
</head>
