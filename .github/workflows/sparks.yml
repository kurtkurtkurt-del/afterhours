# afterhours — the sparks of the day into the database.
# The night agent (a cloud routine, .claude/prompts/spark-night.md) commits
# backend/sparks/<city>/<day>.json at 01:00 Berlin; this runs on that push and puts the
# file into public.spark_days (backend/tools/spark-days.mjs). The schedule at 01:40 UTC
# is a second chance when the push did not fire it. One secret: SUPABASE_SERVICE_ROLE.

name: sparks of the day

on:
  push:
    branches: [main]
    paths: ["backend/sparks/**"]
  schedule:
    - cron: "40 1 * * *"
  workflow_dispatch:

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: put the day's sparks into Supabase
        env:
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: node backend/tools/spark-days.mjs
