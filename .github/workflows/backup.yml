# afterhours — a copy of the content every night, kept 90 days; and, since
# 12.10.2026, a copy of EVERYTHING in the public schema (profiles, friendships,
# cards, groups: the personal data), encrypted, kept 30 days.
#
# tools/backup.mjs reads with the public key in config.js, as the site does:
# the nights, venues, djs and comments everyone can see. Each run is stored
# as a workflow artifact (Actions → backup → the run → Artifacts) and turned
# back into SQL with `node tools/restore.mjs <file>`. Supabase keeps its own
# daily backup on paid plans; this one is ours and does not depend on the plan.
#
# The second job needs two secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     Supabase → Settings → Database → connection string, session mode
#   BACKUP_PASSPHRASE   any long sentence; the dump is useless without it
# Without them the job says so and ends green. Restoring: download the artifact,
# `gpg --decrypt afterhours-data-<run>.sql.gpg > data.sql` (auth.users first, then public), then psql it into a
# fresh project whose structure is in (setup-1, setup-2) — never into the live one
# without a look first.

name: backup

on:
  schedule:
    - cron: "10 3 * * *"
  workflow_dispatch:

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Back up the content
        working-directory: backend
        run: node tools/backup.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: afterhours-${{ github.run_id }}
          path: backend/backup/afterhours-*.json
          retention-days: 90

  personal:
    runs-on: ubuntu-latest
    steps:
      - name: Are the secrets there?
        id: secrets
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB" ] || [ -z "$PASS" ]; then
            echo "SUPABASE_DB_URL or BACKUP_PASSPHRASE is not set; no personal-data backup tonight."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      # pg_dump must be at least the server's version (Supabase runs 17).
      - name: Postgres 17 client
        if: steps.secrets.outputs.ready == 'yes'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump the public schema's data, encrypted
        if: steps.secrets.outputs.ready == 'yes'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          # public data, then auth.users: profiles point at auth.users, so a restore into a
          # clean project needs the accounts first (F36, 20.10.2026). The second dump is
          # column-inserts so it survives a differing auth schema; passwords are hashes.
          ( /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --data-only --table=auth.users --column-inserts --no-owner --no-privileges \
            && /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --data-only --schema=public --no-owner --no-privileges ) \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" \
            -o "afterhours-data-${{ github.run_id }}.sql.gpg"
          ls -la afterhours-data-*.sql.gpg

      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.ready == 'yes'
        with:
          name: afterhours-data-${{ github.run_id }}
          path: afterhours-data-*.sql.gpg
          retention-days: 30
