# afterhours — run the backend tests on every push.
#
# The site itself has no build step and nothing to check here: it is plain
# HTML that the browser reads as it is. What can break silently is the
# database — the rules about who may read what, the seed matching the
# screen, the setup staying repeatable. That is what these 260 checks are
# for, and they run on a real Postgres (PGlite, compiled to WASM) so there
# is nothing to install and no service to wait for.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Tests
        working-directory: backend
        run: npm test

  # The generated SQL is committed, so it can drift from the files it was
  # built from. Rebuilding it and asking git whether anything moved is the
  # cheapest way to catch that.
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Rebuild the generated SQL
        working-directory: backend
        run: |
          node tools/build-seed.mjs
          node tools/world-sql.mjs
          node tools/build-setup.mjs

      - name: It should not have changed
        run: |
          # The two setup files carry a build timestamp, so only their
          # content below the header is compared.
          git diff --stat -- backend/sql/03_seed_catalog.sql \
                             backend/sql/04_seed_events.sql \
                             backend/sql/05_seed_comments.sql \
                             backend/sql/11_world.sql
          if ! git diff --quiet -- backend/sql/03_seed_catalog.sql \
                                   backend/sql/04_seed_events.sql \
                                   backend/sql/05_seed_comments.sql \
                                   backend/sql/11_world.sql; then
            echo "::error::The generated SQL is out of date. Run 'npm run seed' and commit."
            git diff -- backend/sql/03_seed_catalog.sql \
                        backend/sql/04_seed_events.sql \
                        backend/sql/05_seed_comments.sql \
                        backend/sql/11_world.sql | head -60
            exit 1
          fi
          echo "generated SQL matches its sources"

  # Every asset in every page carries ?v=NN, and they have to agree: one
  # page left behind serves a stale script against a new stylesheet.
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: One version across every page
        run: |
          found=$(find . -name '*.html' -not -path './.git/*' \
                  | xargs grep -oh '?v=[0-9]*' | sort -u)
          echo "$found"
          if [ "$(echo "$found" | wc -l)" -ne 1 ]; then
            echo "::error::More than one ?v= in the pages; bump them all together."
            exit 1
          fi
