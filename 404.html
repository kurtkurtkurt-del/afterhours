<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-w="title">nothing here | afterhours</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#000000" />
  <!-- No stylesheet and no webfont on purpose: this page is served for
       ANY missing address at any depth, so a relative href cannot be
       trusted. The system stack below is the whole typography. -->

  <!-- This page can be shown at any depth (Pages returns it for every
       address it cannot find, and the address bar does not change), so it
       asks for no file from outside: the styling lives here. -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px 32px;
      background: #fff;
      color: #000;
      font-family: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .no {
      font-family: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.42;
      margin-bottom: 16px;
    }
    h1 {
      font-size: min(9vw, 76px);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 0.98;
    }
    p {
      margin-top: 22px;
      max-width: 44ch;
      font-size: 16px;
      line-height: 1.62;
      opacity: 0.78;
    }
    nav { display: flex; flex-wrap: wrap; gap: 26px; margin-top: 34px; }
    nav a {
      color: #000;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      border-bottom: 1px solid rgba(0, 0, 0, 0.3);
      padding-bottom: 2px;
    }
    nav a:hover { border-bottom-color: #000; }
  </style>
</head>
<body>
  <p class="no">404</p>
  <h1 data-w-html="head">this one is<br />gone for good.</h1>
  <p data-w="text">Like a night let go. The address does not lead anywhere — the night
    may have passed, or the link lost a piece on the way.</p>

  <nav>
    <a data-path="explore/index.html" data-w="wall">the wall</a>
    <a data-path="maps/index.html" data-w="map">map</a>
    <a data-path="help/index.html" data-w="help">how this works</a>
    <a data-path="index.html" data-w="home">home</a>
  </nav>

  <script>
    /* The site can also be published inside a sub-folder; we work out
       where the root is from the address, so the links work either way. */
    var root = location.pathname.indexOf("/afterhours/") === 0 ? "/afterhours/" : "/";
    document.querySelectorAll("nav a").forEach(function (a) {
      a.href = root + a.dataset.path;
    });

    /* Three languages, decided the way i18n.js decides — but written out
       here, because this page may not ask for any file: the address,
       then what was chosen before, then the browser, then english. */
    (function () {
      var WORDS = {
        en: {
          title: "nothing here | afterhours",
          head: "this one is<br />gone for good.",
          text: "Like a night let go. The address does not lead anywhere — the night may have passed, or the link lost a piece on the way.",
          wall: "the wall",
          map: "map",
          help: "how this works",
          home: "home"
        },
        de: {
          title: "nichts hier | afterhours",
          head: "die hier ist<br />für immer weg.",
          text: "Wie eine Nacht, die man ziehen ließ. Die Adresse führt nirgendwohin — die Nacht ist vielleicht vorbei, oder der Link hat unterwegs ein Stück verloren.",
          wall: "die wand",
          map: "karte",
          help: "so läuft das",
          home: "start"
        },
        tr: {
          title: "burada bir şey yok | afterhours",
          head: "bu gitti,<br />geri gelmez.",
          text: "Bırakılmış bir gece gibi. Bu adres hiçbir yere çıkmıyor — gece geçmiş olabilir, ya da bağlantı yolda bir parçasını kaybetmiştir.",
          wall: "duvar",
          map: "harita",
          help: "bu iş nasıl yürür",
          home: "ana sayfa"
        }
      };

      function known(code) {
        code = String(code || "").toLowerCase().slice(0, 2);
        return WORDS.hasOwnProperty(code) ? code : null;
      }

      var lang = null;
      try { lang = known(new URLSearchParams(location.search).get("lang")); } catch (_) {}
      if (!lang) {
        try { lang = known(localStorage.getItem("afterhours.lang")); } catch (_) {}
      }
      if (!lang) {
        var list = navigator.languages || [navigator.language || ""];
        for (var i = 0; i < list.length && !lang; i++) lang = known(list[i]);
      }
      lang = lang || "en";

      document.documentElement.lang = lang;
      var words = WORDS[lang];
      document.querySelectorAll("[data-w]").forEach(function (el) {
        var word = words[el.getAttribute("data-w")];
        if (word) el.textContent = word;
      });
      document.querySelectorAll("[data-w-html]").forEach(function (el) {
        var word = words[el.getAttribute("data-w-html")];
        if (word) el.innerHTML = word;
      });
    })();
  </script>
  <!-- the web app pill: 404.html answers at any depth, so it is loaded from the root -->
  <script>
    (function () {
      var s = document.createElement("script");
      s.src = (location.pathname.indexOf("/afterhours/") === 0 ? "/afterhours/" : "/") + "webapp.js?v=197";
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
