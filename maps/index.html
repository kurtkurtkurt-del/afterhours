  <main id="content" tabindex="-1" class="map">

    <div class="map-text">
      <h1 class="map-title">go local.</h1>
      <p class="map-sub" id="map-sub">the city, roughly. hover a dot.</p>
    </div>

    <!-- The city schematic: drawn by hand, not to scale. The Isar, the
         ring, the park and a few neighbourhoods — just enough to make
         sense of where the dots sit. -->
    <div class="map-schema-box">
    <svg class="map-schema" id="map-schema" viewBox="450 130 760 640"
         preserveAspectRatio="xMidYMid meet" aria-label="a schematic map of munich">

      <!-- Englischer Garten -->
      <path class="map-park"
            d="M 800 190 L 858 178 L 868 262 L 858 352 L 826 404 L 800 392 L 790 300 Z" />

      <!-- Isar -->
      <path class="map-river"
            d="M 903 130 C 892 220 876 300 864 380 C 852 452 840 500 822 560
               C 802 632 782 702 764 772" />

      <!-- Mittlerer Ring -->
      <path class="map-ring-outer"
            d="M 762 236 C 872 236 962 320 962 434 C 962 560 878 664 762 664
               C 646 664 562 560 562 434 C 562 320 652 236 762 236 Z" />

      <!-- Altstadtring -->
      <circle class="map-ring-inner" cx="770" cy="470" r="58" />

      <!-- birkac ana eksen -->
      <g class="map-link">
        <path d="M 770 412 L 770 250" />
        <path d="M 770 528 L 770 690" />
        <path d="M 712 470 L 560 470" />
        <path d="M 828 470 L 1000 470" />
        <path d="M 728 428 L 620 330" />
        <path d="M 812 512 L 900 600" />
        <path d="M 1000 470 L 1128 512" />
      </g>

      <!-- Hauptbahnhof -->
      <rect class="map-station" x="666" y="462" width="16" height="16" />

      <g class="map-label">
        <text x="700" y="255">SCHWABING</text>
        <text x="614" y="392">MAXVORSTADT</text>
        <text x="906" y="470">HAIDHAUSEN</text>
        <text x="828" y="700">GIESING</text>
        <text x="556" y="560">WESTEND</text>
        <text x="520" y="430">NEUHAUSEN</text>
        <text x="650" y="640">SENDLING</text>
        <text x="500" y="270">OLYMPIAPARK</text>
        <text x="1090" y="540">RIEM</text>
        <text x="806" y="215" class="map-label-park">ENGLISCHER GARTEN</text>
        <text x="700" y="486" class="map-label-station">HBF</text>
      </g>

      <!-- The dots come from map.js -->
      <g id="map-dots"></g>
    </svg>
    </div>

    <!-- The event under the pointer -->
    <div class="map-card" id="map-card" hidden>
      <p class="map-card-kind" id="map-card-kind"></p>
      <p class="map-card-name" id="map-card-name"></p>
