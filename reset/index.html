<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="reset.title">new password | afterhours</title>
  <meta name="description" data-i18n-attr="content:reset.description" content="Forgot your password? A link lands in your inbox, and a new one is set right here." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="../favicon-48.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../favicon-180.png" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="stylesheet" href="../fonts/fonts.css?v=195" />
  <link rel="stylesheet" href="../style.css?v=195" />
  <script src="../i18n.js?v=195"></script>
</head>
<body>

  <a class="skip" href="#content" data-i18n="skip">skip to the content</a>

  <header class="header">
    <a class="logo" href="../index.html">afterhours</a>
    <nav class="header-links">
      <a href="../explore/index.html" data-i18n="nav.explore">explore</a>
      <a href="../djs/index.html" data-i18n="nav.djs">djs</a>
      <a href="../friends/index.html" data-i18n="nav.yours">yours</a>
      <a href="../maps/index.html" data-i18n="nav.map">map</a>
      <a href="../cards/index.html" data-i18n="nav.collection">collection</a>
      <a href="../help/index.html" data-i18n="nav.help">help</a>
      <a href="../login/index.html" data-i18n="nav.account">account</a>
    </nav>
  </header>

  <main id="content" tabindex="-1" class="page">

    <!-- Step one: ask for the link. -->
    <div id="rs-request">
      <h1 class="page-title" data-i18n-html="reset.heading">a new<br />password.</h1>
      <form class="page-form" id="rs-form">
        <label class="page-label" for="rs-email" data-i18n="login.email">your email</label>
        <input class="page-field" id="rs-email" type="email"
               autocomplete="email" placeholder="you@example.com" data-i18n-attr="placeholder:login.email.placeholder" />
        <button class="page-button" id="rs-send" type="submit" data-i18n="reset.send">send me the link</button>
      </form>
      <p class="page-note" id="rs-note"></p>
    </div>

    <!-- Step two: the link brought them back signed in; set the new one. -->
    <div id="rs-set" hidden>
      <h1 class="page-title" data-i18n-html="reset.set.heading">pick a<br />new one.</h1>
      <form class="page-form" id="rs-set-form">
        <label class="page-label" for="rs-password" data-i18n="reset.set.label">new password</label>
        <input class="page-field" id="rs-password" type="password"
               autocomplete="new-password" placeholder="eight characters or more" data-i18n-attr="placeholder:reset.set.placeholder" />
        <button class="page-button" id="rs-save" type="submit" data-i18n="reset.set.button">set the password</button>
      </form>
      <p class="page-note" id="rs-set-note"></p>
    </div>

    <!-- It worked. -->
    <div id="rs-done" hidden>
      <h1 class="page-title" data-i18n="reset.done.heading">that's it.</h1>
      <p class="page-note" data-i18n="reset.done.note">Your password is set and you are signed in.</p>
      <a class="page-button" href="../explore/index.html" data-i18n="reset.done.back">back to explore</a>
    </div>

  </main>

  <footer class="foot">
    <p class="foot-name" data-i18n="foot.name">&copy; 2026 afterhours</p>
    <nav class="foot-links">
      <a href="../impressum/index.html" data-i18n="foot.impressum">impressum</a>
      <a href="../datenschutz/index.html" data-i18n="foot.datenschutz">datenschutz</a>
      <a href="../agb/index.html" data-i18n="foot.agb">agb</a>
    </nav>
  </footer>

  <script src="../config.js?v=195"></script>
  <script src="../session.js?v=195"></script>
  <script src="../menu.js?v=195"></script>
  <script src="../data.js?v=195"></script>
  <script src="reset.js?v=195"></script>

</body>
</html>
