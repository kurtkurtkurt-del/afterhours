<body class="explore">

  <a class="skip" href="#content">skip to the content</a>

  <header class="header">
    <a class="logo" href="../index.html">afterhours</a>
    <nav class="header-links">
      <a href="../explore/index.html" aria-current="page">explore</a>
      <a href="../djs/index.html">djs</a>
      <a href="../friends/index.html">yours</a>
      <a href="../maps/index.html">map</a>
      <a href="../cards/index.html">collection</a>
      <a href="../help/index.html">help</a>
      <a href="../login/index.html">account</a>
    </nav>
  </header>

  <main id="content" tabindex="-1" class="ex-wall-page">

    <!-- The deck's filter line, unchanged: country / city / kind / date -->
    <div class="ex-filter">
      <div class="fl" data-field="country">
        <button class="fl-button" type="button" aria-expanded="false" aria-label="country">
          <span class="fl-value">deutschland</span>
        </button>
        <div class="fl-list" hidden></div>
      </div>

      <div class="fl" data-field="city">
        <button class="fl-button" type="button" aria-expanded="false" aria-label="city">
          <span class="fl-value">münchen</span>
        </button>
        <div class="fl-list" hidden></div>
      </div>

      <div class="fl" data-field="kind">
        <button class="fl-button" type="button" aria-expanded="false" aria-label="category">
          <span class="fl-value">all events</span>
        </button>
        <div class="fl-list" hidden></div>
      </div>

      <div class="fl" data-field="date">
        <button class="fl-button" type="button" aria-expanded="false" aria-label="date">
          <span class="fl-value">any night</span>
        </button>
        <div class="fl-list" hidden></div>
      </div>
    </div>

    <!-- The wall: every night that fits, soonest first. wall.js hangs them. -->
    <div class="ex-wall" id="ex-wall"></div>
    <p class="ex-empty" id="ex-empty" hidden></p>

    <p class="ex-tally" id="ex-tally" aria-live="polite"></p>
  </main>


  <footer class="foot thin right">
    <p class="foot-name">&copy; 2026 afterhours</p>

    </nav>
  </footer>

  <script src="../config.js?v=175"></script>
  <script src="../session.js?v=175"></script>
  <script src="../menu.js?v=175"></script>
  <script src="../data.js?v=175"
          data-fallback="../events-data.js?v=175"
          data-after="wall.js?v=175, filters.js?v=175"></script>

</body>
</html>
