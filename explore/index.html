<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>explore | afterhours</title>
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="../favicon-48.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../favicon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css?v=76" />
</head>
<body class="explore">

  <header class="header">
    <a class="logo" href="../index.html">afterhours</a>
    <nav class="header-links">
      <a href="../explore/index.html" aria-current="page">explore</a>
      <a href="../friends/index.html">friends&amp;more</a>
      <a href="../maps/index.html">i prefer maps</a>
      <a href="../help/index.html">help</a>
      <a href="../login/index.html">login</a>
    </nav>
  </header>

  <main class="ex-alan">

    <nav class="ex-modlar">
      <button class="ex-mod secili" type="button" aria-current="true">global deck</button>
      <button class="ex-mod" type="button">friends liked swipes</button>
      <button class="ex-mod" type="button">i feel lucky</button>

      <!-- Mod degil, islem: atilan her sey silinir -->
      <button class="ex-sifirla" id="ex-sifirla" type="button">reset deck</button>
    </nav>

    <div class="ex-sol">
      <div class="ex-filtre">
        <div class="fl" data-alan="ulke">
          <button class="fl-dugme" type="button" aria-expanded="false" aria-label="country">
            <span class="fl-deger">deutschland</span>
          </button>
          <div class="fl-liste" hidden></div>
        </div>

        <div class="fl" data-alan="sehir">
          <button class="fl-dugme" type="button" aria-expanded="false" aria-label="city">
            <span class="fl-deger">münchen</span>
          </button>
          <div class="fl-liste" hidden></div>
        </div>

        <div class="fl" data-alan="tur">
          <button class="fl-dugme" type="button" aria-expanded="false" aria-label="category">
            <span class="fl-deger">all events</span>
          </button>
          <div class="fl-liste" hidden></div>
        </div>

        <div class="fl" data-alan="tarih">
          <button class="fl-dugme" type="button" aria-expanded="false" aria-label="date">
            <span class="fl-deger">tonight</span>
          </button>
          <div class="fl-liste" hidden></div>
        </div>
      </div>

      <p class="ex-servis">your deck is served</p>
      <!-- Kartin ustunde: sol gecmek, sag begenip biriktirmek -->
      <div class="ex-yonler">
        <span class="ex-yon">
          <svg class="ex-yon-cizim" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M12.5 10 H4.5 M7.5 6.5 L4 10 L7.5 13.5" />
            <path d="M14 6.5 L18 13.5 M18 6.5 L14 13.5" />
          </svg>
          <span class="ex-yon-yazi">not for me</span>
        </span>

        <span class="ex-yon sag">
          <span class="ex-yon-yazi">keep it</span>
          <svg class="ex-yon-cizim" viewBox="0 0 28 20" aria-hidden="true">
            <path d="M0.5 10 H8.5 M5.5 6.5 L9 10 L5.5 13.5" />
            <rect x="13.6" y="3.2" width="9.8" height="13.6" rx="1.9"
                  transform="rotate(-11 18.5 10)" />
            <rect x="15.6" y="3.2" width="9.8" height="13.6" rx="1.9" />
          </svg>
        </span>
      </div>

      <div class="ex-deste" id="ex-deste"><!-- kartlar explore.js ile --></div>
      <p class="ex-bitti" id="ex-bitti">that's everyone for tonight.</p>

      <!-- En altta: solda klavye, sagda fare ile kontrol -->
      <div class="ex-ipuclari">
        <span class="ex-ipucu">
          <svg class="ex-ipucu-cizim" viewBox="0 0 46 20" aria-hidden="true">
            <rect x="0.8" y="0.8" width="18.4" height="18.4" rx="3.4" />
            <path d="M13 10 H7 M10 7 L7 10 L10 13" />
            <rect x="26.8" y="0.8" width="18.4" height="18.4" rx="3.4" />
            <path d="M33 10 H39 M36 7 L39 10 L36 13" />
          </svg>
          <span class="ex-ipucu-yazi">arrow keys</span>
        </span>

        <span class="ex-ipucu">
          <svg class="ex-ipucu-cizim" viewBox="0 0 46 20" aria-hidden="true">
            <path d="M6 10 H1 M3.5 7.5 L1 10 L3.5 12.5" />
            <rect x="16.8" y="0.8" width="12.4" height="18.4" rx="6.2" />
            <path d="M23 4.6 V8" />
            <path d="M40 10 H45 M42.5 7.5 L45 10 L42.5 12.5" />
          </svg>
          <span class="ex-ipucu-yazi">or drag it</span>
        </span>
      </div>
    </div>

    <div class="ex-kutu">
      <button class="ex-kutu-dugme" id="ex-kutu-dugme" type="button"
              aria-expanded="false" aria-label="kept tonight">
        <svg class="ex-kutu-simge" viewBox="0 0 28 28" aria-hidden="true">
          <rect x="7.5" y="5" width="13" height="18.5" rx="2.4"
                transform="rotate(-11 14 14.25)" />
          <rect x="7.5" y="5" width="13" height="18.5" rx="2.4" />
        </svg>
        <span class="ex-rozet" id="ex-rozet" hidden>0</span>
      </button>

      <div class="ex-kutu-liste" id="ex-kutu-liste" hidden>
        <p class="ex-kutu-baslik">kept tonight</p>
        <div id="ex-kutu-icerik"><!-- explore.js --></div>
      </div>
    </div>

    <aside class="ex-yorum">
      <button class="ex-yorum-baslik" id="ex-yorum-dugme" type="button" aria-expanded="true">beforehours</button>
      <div class="ex-yorum-liste" id="ex-yorum-liste"><!-- yorumlar explore.js ile --></div>
    </aside>

  </main>

  <script src="../ayar.js?v=76"></script>
  <script src="../oturum.js?v=76"></script>
  <script src="../menu.js?v=76"></script>
  <script src="../atislar.js?v=76"></script>
  <script src="../beforehours.js?v=76"></script>
  <script src="../arkadaslar.js?v=76"></script>
  <script src="yorumlar.js?v=76"></script>
  <script src="../veri.js?v=76"
          data-yedek="../events-data.js?v=76"
          data-sonra="explore.js?v=76, filtre.js?v=76"></script>

</body>
</html>
