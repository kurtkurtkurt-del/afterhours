<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="../favicon-48.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../favicon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css?v=104" />
</head>
<body>

  <header class="header">
    <a class="logo" href="../index.html">afterhours</a>
    <nav class="header-links">
      <a href="../explore/index.html">explore</a>
      <a href="../friends/index.html">friends&amp;more</a>
      <a href="../cards/index.html">card collection</a>
      <a href="../help/index.html">help</a>
      <a href="../login/index.html" aria-current="page">login</a>
    </nav>
  </header>

  <main class="giris hesap-sayfa">
   <div class="hs-sol">
    <h1 class="giris-baslik">good to see you<br />again.</h1>

    <form class="giris-form" id="giris-form" novalidate>
      <label class="giris-etiket" for="giris-eposta">your email</label>
      <input class="giris-alan" id="giris-eposta" type="email" name="email"
             autocomplete="username" placeholder="you@example.com" required />

      <label class="giris-etiket" for="giris-sifre">your password</label>
      <input class="giris-alan" id="giris-sifre" type="password" name="password"
             autocomplete="current-password" placeholder="••••••••" required />

      <button class="giris-dugme" id="giris-dugme" type="submit">sign in</button>
    </form>

    <p class="giris-not" id="giris-not"></p>

    <div class="giris-icerde" id="giris-icerde" hidden>
      <p class="giris-kim" id="giris-kim"></p>

      <button class="giris-cik" id="giris-cik" type="button">sign out</button>
    </div>
   </div>

   <!-- Girisin yanindaki iki kisa yol; basliklariyla ayni satirda.
        Ortadaki oturuma gore degisiyor (login/hesap.js). -->
   <section class="hs-yol">
     <div id="hs-disarida">
       <h2 class="hs-baslik">first<br />time?</h2>
       <p class="hs-alt">register to afterhours</p>
       <a class="hs-link" href="../register/index.html">here you go</a>
     </div>

     <div id="hs-icerde" hidden>
       <h2 class="hs-baslik">account<br />settings.</h2>
       <p class="hs-alt">control your profile</p>
       <a class="hs-link" href="../settings/index.html">settings</a>
     </div>
   </section>

   <section class="hs-yol">
     <h2 class="hs-baslik">give<br />feedback.</h2>
     <p class="hs-alt">tell us what is missing</p>
     <a class="hs-link" href="../feedback/index.html">help us</a>
   </section>
  </main>


  <footer class="dipnot">
    <p class="dipnot-ad">&copy; 2026 afterhours</p>
    <nav class="dipnot-linkler">
      <a href="../impressum/index.html">impressum</a>
      <a href="../datenschutz/index.html">datenschutz</a>
      <a href="../agb/index.html">agb</a>
    </nav>
  </footer>

  <script src="../ayar.js?v=104"></script>
  <script src="../oturum.js?v=104"></script>
  <script src="../menu.js?v=104"></script>

  <script src="hesap.js?v=104"></script>

</body>
</html>
